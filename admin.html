function logoPick(){syncC();const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);let d="";for(const q of[.9,.75,.6,.45]){d=c.toDataURL("image/webp",q);if(d.indexOf("data:image/webp")!==0){d=c.toDataURL("image/png");break}if(d.length<225000)break}if(d.length>=230000)return alert("Gambar logo terlalu besar, coba gambar yang lebih kecil atau sederhana.");D.cfg.logo=d;app()};im.src=r.result};r.readAsDataURL(f)};i.click()}
function logoClr(){syncC();D.cfg.logo="";app()}
function saveC(){syncC();const c=D.cfg;run("adm_cfg",{brand:c.brand,banner:c.banner,sub:c.sub,wa:c.wa,notice:c.notice,neg:c.neg,negu:c.negu,footer:c.footer,footon:c.footon!==false,toast:c.toast!==false,brandon:c.brandon!==false,theme:c.theme,logo:c.logo||"",pop:c.pop||[],fl:c.fl||[]},"Tampilan tersimpan")}
